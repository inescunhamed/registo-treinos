<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registo de Treinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
--ink:#18222b; --ink2:#55606b; --mute:#8a949e; --bg:#f4f6f9; --card:#fff; --line:#e3e8ee;
--soft:#eaeff5; --accent:#6c4fd8; --ok:#0aa84f; --danger:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:110px}
h1,h2,.big{font-family:Archivo,Inter,sans-serif;letter-spacing:-.02em}
.top{background:var(--ink);color:#fff;padding:22px 20px 70px}
.top h1{font-size:30px;font-weight:900}
.top p{color:#b9c2cb;margin-top:6px;font-size:15px}
.wrap{padding:0 16px}
.lift{margin-top:-50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px}
.card h2{font-size:20px;font-weight:800;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--mute)}
.small{font-size:13px}
/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{font-size:13px;color:var(--mute);font-weight:600;margin-bottom:8px}
.dot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin:0 auto;font-weight:700;background:var(--soft);color:var(--mute)}
.dot.on{background:var(--ink);color:#fff}
.dot.today{outline:2.5px solid var(--ink);outline-offset:-2.5px;background:#fff;color:var(--ink)}
.dot.on.today{background:var(--ink);color:#fff}
.wl{font-size:11px;color:var(--ink2);margin-top:6px;line-height:1.2;min-height:26px}
/* planos */
.plan{display:block;width:100%;text-align:left}
.plan h3{font-size:19px;font-weight:700;margin-bottom:8px}
.kv{font-size:15px;line-height:1.75}
.kv b{font-weight:700}
.kv span{color:var(--ink2)}
.btn{display:block;width:100%;padding:16px;border-radius:999px;font-weight:700;font-size:16px;text-align:center}
.btn.dark{background:var(--ink);color:#fff}
.btn.green{background:var(--ok);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn:disabled{opacity:.5}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:488px;background:#fff;border:1px solid var(--line);border-radius:999px;display:flex;padding:8px;box-shadow:0 8px 30px rgba(24,34,43,.12);z-index:20}
.nav button{flex:1;padding:10px 4px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.act{background:var(--soft);color:var(--ink)}
.nav svg{width:24px;height:24px}
/* treino */
.bar{display:flex;align-items:center;gap:12px;padding:18px 16px 8px}
.back{width:48px;height:48px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.bar h1{font-size:24px;font-weight:900;line-height:1.1}
.datef{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin:6px 16px 14px;font-weight:600}
.datef input{border:0;background:none;font-weight:600;flex:1;min-width:0}
.ex h3{font-size:20px;font-weight:700;line-height:1.2}
.exhead{margin:12px 0 14px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pic{aspect-ratio:1;border-radius:16px;background:var(--soft);overflow:hidden;position:relative}
.pic small{position:absolute;left:8px;top:6px;font-size:11px;font-weight:700;color:var(--ink2)}
.ss{font-size:13px;font-weight:700;color:var(--accent);margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.ss span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink2)}
.pic svg{width:100%;height:100%}
.presc{font-size:15px;line-height:1.7}
.presc b{font-weight:700}.presc span{color:var(--ink2)}
.sets{background:var(--soft);border-radius:18px;padding:12px}
.sets .h,.sets .r{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:8px;align-items:center}
.sets .h{font-size:13px;color:var(--ink2);font-weight:600;padding:0 0 6px}
.sets .h div{text-align:center}
.sets .r{margin-bottom:8px}
.sets .r b{font-weight:700;padding-left:4px}
.sets input{width:100%;border:0;background:#fff;border-radius:999px;padding:12px 6px;text-align:center;font-size:17px;-moz-appearance:textfield}
.sets input::-webkit-outer-spin-button,.sets input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.x{width:32px;height:32px;border-radius:50%;color:var(--mute);display:grid;place-items:center}
.addset{margin-top:4px;padding:12px;border-radius:999px;background:var(--ink);color:#fff;width:100%;font-weight:600}
.last{font-size:13px;color:var(--ink2);margin-top:10px}
.histbtn{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.finish{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:488px;z-index:20;box-shadow:0 8px 24px rgba(10,168,79,.3)}
/* calendário */
.stats{background:var(--soft);border-radius:24px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.stats .tot{text-align:center;padding:18px}
.stats .tot .big{font-size:48px;font-weight:900}
.stats .tri{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;padding:16px 4px}
.stats .tri div{text-align:center;border-right:1px solid var(--line)}
.stats .tri div:last-child{border:0}
.stats .tri .big{font-size:26px;font-weight:900}
.stats .tri small{color:var(--ink2);font-size:12px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead h2{margin:0;font-size:22px}
.circ{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .wd{font-size:13px;font-weight:700;color:var(--ink2);padding:6px 0;background:var(--soft)}
.grid .wd:first-child{border-radius:10px 0 0 10px}.grid .wd:nth-child(7){border-radius:0 10px 10px 0}
.cell{padding:8px 0 4px;min-height:74px}
.cell .dot{width:38px;height:38px;font-size:15px;background:none;color:var(--ink)}
.cell .dot.on{background:var(--ink);color:#fff}
.cell .dot.today{outline:2px solid var(--ink)}
.cell.out .dot{color:#c3c9cf}
.cell .wl{font-size:10px;min-height:0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 1px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(24,34,43,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:85vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px 30px}
.sheet h2{font-size:21px;font-weight:800;margin-bottom:4px}
.sess{border-top:1px solid var(--line);padding:14px 0}
.sess h4{font-size:16px;margin-bottom:6px}
.sess li{list-style:none;font-size:14px;line-height:1.6;color:var(--ink2)}
.sess li b{color:var(--ink);font-weight:600}
.del{color:var(--danger);font-size:14px;font-weight:600;padding:6px 0}
.note{background:#fff7e0;border:1px solid #f0dc9c;color:#6b5512;border-radius:16px;padding:12px 14px;font-size:14px;margin:0 16px 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:16px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:60;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:20px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<script>
/* ============================================================
ILUSTRAÇÕES — boneco simples desenhado em SVG.
Membros do lado de lá a cinzento, do lado de cá a preto.
============================================================ */
const P=a=>a.join(" ");
function F(j,extra="",under=""){
const L=(a,b,c)=>a&&b?`<path d="M${P(a)} L${P(b)}${c?` L${P(c)}`:""}"/>`:"";
const far=`<g stroke="#9aa4ae">${L(j.n,j.e2,j.w2)}${L(j.p,j.k2,j.f2)}</g>`;
const near=`${L(j.n,j.p)}${L(j.n,j.e1,j.w1)}${L(j.p,j.k1,j.f1)}`;
return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#eaeff5"/>
<line x1="0" y1="91" x2="100" y2="91" stroke="#c9d1da" stroke-width="2"/>${under}
<g fill="none" stroke="#18222b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">${far}${near}</g>
<circle cx="${j.h[0]}" cy="${j.h[1]}" r="6.5" fill="#18222b"/>${extra}</svg>`;
}
const D=(x,y,v)=>v?`<rect x="${x-3.5}" y="${y-7}" width="7" height="14" rx="2.5" fill="#6c4fd8"/>`:`<rect x="${x-7}" y="${y-3.5}" width="14" height="7" rx="2.5" fill="#6c4fd8"/>`; // halter
const BANCO=(x,y,w,h=7)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#b7c0ca"/><rect x="${x+3}" y="${y+h}" width="4" height="${91-y-h}" fill="#c9d1da"/><rect x="${x+w-7}" y="${y+h}" width="4" height="${91-y-h}" fill="#c9d1da"/>`;
const ELAST=(a,b)=>`<path d="M${P(a)} L${P(b)}" stroke="#e0703a" stroke-width="2.5" stroke-dasharray="4 3" fill="none"/>`;
const POSTE=`<rect x="4" y="20" width="5" height="71" fill="#b7c0ca"/>`;
const SETA=(a,b)=>`<path d="M${P(a)} L${P(b)}" stroke="#0aa84f" stroke-width="2.5" fill="none" marker-end="url(#m)"/><defs><marker id="m" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0aa84f"/></marker></defs>`;

const FIGS={
lunge:[
F({h:[50,14],n:[50,23],p:[50,51],e1:[51,37],w1:[52,52],e2:[49,37],w2:[48,52],k1:[51,70],f1:[51,89],k2:[49,70],f2:[49,89]},D(52,54,1)),
F({h:[48,30],n:[48,39],p:[48,64],e1:[49,52],w1:[50,66],e2:[47,52],w2:[46,66],k1:[68,65],f1:[68,89],k2:[38,82],f2:[22,89]},D(50,68,1))
],

F({h:[11,59],n:[19,66],p:[48,64],e1:[19,89],w1:[33,89],e2:[30,60],w2:[42,62],k1:[72,56],f1:[90,56],k2:[66,66],f2:[84,66]},SETA([52,84],[56,72]),BANCO(66,57,32))
],

F({h:[14,44],n:[24,52],p:[44,76],e1:[32,64],w1:[42,72],k1:[64,62],f1:[70,89],k2:[56,56],f2:[70,58]},"",BANCO(4,54,24)),

],

F({h:[50,14],n:[50,23],p:[50,51],e1:[58,37],w1:[60,52],e2:[64,26],w2:[80,22],k1:[50,68],f1:[52,82],k2:[46,68],f2:[38,74]},D(60,55,1)+`<rect x="80" y="4" width="5" height="87" fill="#b7c0ca"/>`,`<rect x="38" y="82" width="30" height="9" rx="2" fill="#b7c0ca"/>`),
F({h:[50,8],n:[50,17],p:[50,45],e1:[58,31],w1:[60,46],e2:[64,22],w2:[80,18],k1:[50,62],f1:[53,78],k2:[46,62],f2:[38,68]},D(60,49,1)+`<rect x="80" y="4" width="5" height="87" fill="#b7c0ca"/>`+SETA([30,80],[30,66]),`<rect x="38" y="82" width="30" height="9" rx="2" fill="#b7c0ca"/>`)
],
pranchaFrontal:[
F({h:[14,70],n:[22,74],p:[56,76],e1:[22,89],w1:[36,89],k1:[72,81],f1:[90,88]}),
F({h:[14,52],n:[22,58],p:[56,68],e1:[22,74],w1:[22,89],k1:[72,77],f1:[90,88]},SETA([40,86],[40,74]))
],
rotacao:[
F({h:[56,14],n:[56,24],p:[56,52],e1:[44,34],w1:[30,38],e2:[46,32],w2:[30,36],k1:[52,70],f1:[48,89],k2:[60,70],f2:[64,89]},ELAST([9,37],[30,37]),POSTE),
F({h:[56,14],n:[56,24],p:[56,52],e1:[68,34],w1:[82,38],e2:[66,32],w2:[82,36],k1:[52,70],f1:[48,89],k2:[60,70],f2:[64,89]},ELAST([9,37],[82,37])+SETA([40,58],[70,58]),POSTE)
],
pushup:[
F({h:[16,34],n:[24,40],p:[56,63],e1:[24,50],w1:[22,58],k1:[72,76],f1:[90,88]},"",BANCO(8,58,30)),
F({h:[20,48],n:[30,52],p:[60,69],e1:[40,46],w1:[24,58],k1:[75,79],f1:[90,88]},SETA([46,30],[46,42]),BANCO(8,58,30))
],
voos:[

F({h:[50,14],n:[50,23],p:[50,51],e1:[36,25],w1:[22,25],e2:[64,25],w2:[78,25],k1:[46,70],f1:[44,89],k2:[54,70],f2:[56,89]},D(19,25,1)+D(81,25,1))
],
remada:[

F({h:[22,40],n:[30,44],p:[62,46],e1:[50,36],w1:[42,52],e2:[33,52],w2:[34,60],k1:[74,68],f1:[78,89],k2:[64,60],f2:[84,60]},D(42,55)+SETA([30,74],[30,60]),BANCO(28,60,50))
],
shoulder:[
F({h:[50,26],n:[50,35],p:[50,62],e1:[36,44],w1:[36,30],e2:[64,44],w2:[64,30],k1:[44,76],f1:[42,89],k2:[56,76],f2:[58,89]},D(36,28)+D(64,28)),
F({h:[50,26],n:[50,35],p:[50,62],e1:[40,22],w1:[42,8],e2:[60,22],w2:[58,8],k1:[44,76],f1:[42,89],k2:[56,76],f2:[58,89]},D(42,7)+D(58,7))
],
curl:[
F({h:[50,14],n:[50,23],p:[50,51],e1:[50,38],w1:[51,54],e2:[48,38],w2:[47,54],k1:[51,70],f1:[51,89],k2:[49,70],f2:[49,89]},D(51,56)),
F({h:[50,14],n:[50,23],p:[50,51],e1:[50,38],w1:[62,27],e2:[48,38],w2:[47,54],k1:[51,70],f1:[51,89],k2:[49,70],f2:[49,89]},D(63,25)+SETA([70,50],[70,34]))
],
triceps:[
F({h:[14,54],n:[22,57],p:[56,57],e1:[26,40],w1:[26,22],k1:[72,46],f1:[76,89]},D(26,20),BANCO(14,61,54)),
F({h:[14,54],n:[22,57],p:[56,57],e1:[26,40],w1:[14,42],k1:[72,46],f1:[76,89]},D(12,43)+SETA([38,24],[38,36]),BANCO(14,61,54))
],
bulgaro:[
F({h:[44,14],n:[44,23],p:[46,50],e1:[45,36],w1:[46,52],k1:[36,70],f1:[28,89],k2:[60,66],f2:[80,58]},D(46,55,1),BANCO(72,58,26)),
F({h:[46,28],n:[46,37],p:[48,64],e1:[47,50],w1:[48,66],k1:[30,64],f1:[28,89],k2:[56,84],f2:[80,58]},D(48,69,1),BANCO(72,58,26))
],
abducao:[
F({h:[12,72],n:[22,78],p:[54,82],e1:[34,72],w1:[48,76],e2:[16,88],w2:[8,80],k1:[70,82],f1:[88,83],k2:[70,86],f2:[88,87]}),
F({h:[12,72],n:[22,78],p:[54,82],e1:[34,72],w1:[48,76],e2:[16,88],w2:[8,80],k1:[70,72],f1:[86,60],k2:[70,86],f2:[88,87]},SETA([92,80],[90,64]))
],
deadlift:[
F({h:[50,14],n:[50,23],p:[52,51],e1:[50,37],w1:[50,53],k1:[52,70],f1:[52,89]},D(50,56)),
F({h:[20,38],n:[29,40],p:[56,50],e1:[30,54],w1:[31,68],k1:[52,70],f1:[52,89]},D(31,71))
],
pranchaRot:[
F({h:[12,62],n:[20,68],p:[54,78],e1:[20,89],w1:[34,89],e2:[22,52],w2:[22,34],k1:[72,84],f1:[90,88]}),
F({h:[16,66],n:[22,70],p:[54,72],e1:[20,89],w1:[34,89],e2:[32,78],w2:[44,84],k1:[72,81],f1:[90,88]},SETA([12,40],[30,66]))
],
lungeLateral:[
F({h:[50,14],n:[50,23],p:[50,51],e1:[46,37],w1:[46,52],e2:[54,37],w2:[54,52],k1:[42,70],f1:[34,89],k2:[58,70],f2:[66,89]},D(46,55,1)+D(54,55,1)),
F({h:[60,30],n:[60,39],p:[60,64],e1:[57,52],w1:[56,68],e2:[64,52],w2:[66,68],k1:[42,77],f1:[22,89],k2:[76,70],f2:[78,89]},D(56,71,1)+D(66,71,1)+SETA([60,10],[80,10]))
],
pranchaJoelho:[
F({h:[12,62],n:[20,68],p:[54,78],e1:[20,89],w1:[34,89],e2:[16,52],w2:[10,58],k1:[72,84],f1:[90,88],k2:[72,86],f2:[90,89]}),
F({h:[12,62],n:[20,68],p:[54,76],e1:[20,89],w1:[34,89],e2:[16,52],w2:[10,58],k1:[40,62],f1:[58,74],k2:[72,84],f2:[90,88]},SETA([76,66],[52,58]))
]
};

/* ============================================================
PLANOS DE TREINO (fixos). Os exercícios vão aos pares:
cada par é uma super série.
============================================================ */
const X=(id,nome,fig)=>({id,nome,series:3,reps:"8-12",fig:FIGS[fig]});
const PLANOS = [
{ id:"t1", nome:"Treino 1", exercicios:[
X("lunge-alt","Lunge alternado com halteres","lunge"),
X("adutor-copenhaga","Adutor Copenhaga","copenhaga"),
X("hip-thrust-uni","Hip thrust unilateral","hipthrust"),
X("gemeos-uni","Gémeos unilateral com halter","gemeos"),
X("prancha-frontal-din","Prancha frontal dinâmica","pranchaFrontal"),
X("rotacao-elastico","Rotação da coluna com elástico","rotacao")
]},
{ id:"t2", nome:"Treino 2", exercicios:[
X("push-ups-incl","Push ups inclinadas","pushup"),
X("voos-laterais","Voos laterais com halteres","voos"),
X("remada-uni","Remada unilateral com halter","remada"),
X("shoulder-press","Shoulder press com halteres","shoulder"),
X("bicep-curl","Bicep curl com halteres","curl"),
X("tricep-testa","Tricep à testa com halteres","triceps")
]},
{ id:"t3", nome:"Treino 3", exercicios:[
X("bulgarian-split","Bulgarian split squat","bulgaro"),
X("side-lying-abd","Side lying hip abduction","abducao"),
X("deadlift-halteres","Deadlift com halteres","deadlift"),
X("prancha-lat-rot","Prancha lateral com rotação","pranchaRot"),
X("lunge-lateral","Lunge lateral com halteres","lungeLateral"),
X("prancha-lat-joelho","Prancha lateral com joelho ao lado","pranchaJoelho")
]}
];

/* ============================================================ */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DSEM=["S","T","Q","Q","S","S","D"]; // segunda a domingo
const fmtData = s=>{const d=parse(s);return `${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}`};
const plano = id=>PLANOS.find(p=>p.id===id);

const st = {
view: (["inicio","calendario"].includes(location.hash.slice(1))?location.hash.slice(1):"inicio"),
sessoes: [], loaded:false, slow:false, dbOk:null,
planoAtivo:null, draft:null, mes:(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1)})(),
saving:false
};
/* Endereço da Aplicação Web do Google Apps Script (Google Sheet) */
const API_URL = "https://script.google.com/macros/s/AKfycbw4hAlvaSeHVbTTKCd1dog718vdHPS_5uKFHWLej5PGkdkSvoiUjRHMC3S0MB7DZWUv/exec";
async function api(body){
const r = body
? await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
: await fetch(API_URL+"?t="+Date.now());
const j = await r.json();
if(!j.ok) throw new Error(j.erro||"erro");
return j;
}
function receber(lista){
st.sessoes=(lista||[]).map(s=>({...s,_id:s.id})).filter(s=>typeof s.data==="string");
st.loaded=true; st.slow=false; st.dbOk=true;
try{localStorage.setItem("cache-sessoes",JSON.stringify(lista))}catch(e){}
if(st.view!=="treino") render();
}

/* ---------- dados ---------- */
const porDia = ()=>{const m={};for(const s of st.sessoes){(m[s.data]??=[]).push(s)}return m};
function ultimaSessaoPlano(pid){return st.sessoes.filter(s=>s.plano===pid).sort((a,b)=>(b.data+b.criadoEm).localeCompare(a.data+a.criadoEm))[0]}
function historicoEx(exId){
const out=[];
for(const s of [...st.sessoes].sort((a,b)=>(b.data+b.criadoEm).localeCompare(a.data+a.criadoEm))){
const e=(s.exercicios||[]).find(e=>e.id===exId); if(e&&e.series?.length) out.push({data:s.data,series:e.series});
}
return out;
}
const fmtSeries = ser=>ser.map(x=>`${x.reps??"–"}×${x.kg??0} kg`).join(" · ");

/* ---------- render ---------- */
function render(){
const app=$("#app");
if(st.view==="treino"){ app.innerHTML=viewTreino(); bindTreino(); return; }
app.innerHTML = (st.view==="calendario"?viewCalendario():viewInicio()) + nav();
app.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));
app.querySelectorAll("[data-plano]").forEach(b=>b.onclick=()=>abrirPlano(b.dataset.plano));
app.querySelectorAll("[data-dia]").forEach(b=>b.onclick=()=>abrirDia(b.dataset.dia));
const pm=$("#prevM"),nm=$("#nextM");
if(pm){pm.onclick=()=>{st.mes=new Date(st.mes.getFullYear(),st.mes.getMonth()-1,1);render()};nm.onclick=()=>{st.mes=new Date(st.mes.getFullYear(),st.mes.getMonth()+1,1);render()}}
}
function go(v){st.view=v;try{history.replaceState(null,"","#"+v)}catch(e){};render();scrollTo(0,0)}

function nav(){
const i=(n,lbl,svg)=>`<button data-nav="${n}" class="${st.view===n?"act":""}">${svg}${lbl}</button>`;
return `<nav class="nav">
${i("inicio","Início",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>')}
${i("calendario","Calendário",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>')}
</nav>`;
}

function statusNote(){
if(!API_URL) return `<div class="note">A página ainda não está ligada à folha de registos.</div>`;
if(st.dbOk===false) return `<div class="note">Sem ligação ao registo. ${st.sessoes.length?"Estás a ver os últimos dados guardados neste telemóvel.":""}</div>`;
if(!st.loaded && st.slow) return `<div class="note">Ainda a carregar os treinos… pode ser da ligação.</div>`;
return "";
}

function semana(){
const hoje=new Date(); const dow=(hoje.getDay()+6)%7;
const seg=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate()-dow);
const m=porDia(); let html="";
for(let i=0;i<7;i++){
const d=new Date(seg.getFullYear(),seg.getMonth(),seg.getDate()+i), k=ymd(d), ss=m[k]||[];
const lbl=ss.length?esc(ss[0].planoNome)+(ss.length>1?` +${ss.length-1}`:""):"";
html+=`<button data-dia="${k}"><div class="d">${DSEM[i]}</div><div class="dot ${ss.length?"on":""} ${k===ymd(hoje)?"today":""}">${d.getDate()}</div><div class="wl">${lbl}</div></button>`;
}
return html;
}
function sequenciaAtual(){
const dias=new Set(st.sessoes.map(s=>s.data)); let d=new Date(); let n=0;
if(!dias.has(ymd(d))) d.setDate(d.getDate()-1);
while(dias.has(ymd(d))){n++;d.setDate(d.getDate()-1)}
return n;
}

function viewInicio(){
const seq=sequenciaAtual();
const planos=PLANOS.map(p=>{
const feitos=st.sessoes.filter(s=>s.plano===p.id);
const ult=ultimaSessaoPlano(p.id);
return `<button class="card plan" data-plano="${p.id}">
<h3>${esc(p.nome)}</h3>
<div class="kv"><b>Exercícios:</b> <span>${p.exercicios.length}</span><br>
<b>Realizados:</b> <span>${feitos.length}</span><br>
<b>Última vez:</b> <span>${ult?fmtData(ult.data):"—"}</span></div>
</button>`}).join("");
return `<div class="top"><h1>Registo de Treinos</h1><p>${st.sessoes.length} treinos registados</p></div>
<div class="wrap lift">
<div class="card">
<div class="row" style="margin-bottom:14px"><h2 style="margin:0">🔥 ${seq} ${seq===1?"dia seguido":"dias seguidos"}</h2></div>
<div class="week">${semana()}</div>
</div>
</div>
${statusNote()}
<div class="wrap"><h2 style="font-size:22px;margin:8px 4px 12px">Treinos</h2>${planos}</div>`;
}

function viewCalendario(){
const y=st.mes.getFullYear(), mo=st.mes.getMonth();
const m=porDia(); const hoje=ymd(new Date());
const doMes=st.sessoes.filter(s=>{const d=parse(s.data);return d.getFullYear()===y&&d.getMonth()===mo});
// melhor sequência (dias seguidos) no mês
const ult=new Date(y,mo+1,0).getDate(); let best=0,cur=0;
for(let d=1;d<=ult;d++){ if(m[ymd(new Date(y,mo,d))]){cur++;best=Math.max(best,cur)} else cur=0 }
// média semanal: treinos / semanas decorridas no mês
const now=new Date(); const fimDia=(y===now.getFullYear()&&mo===now.getMonth())?now.getDate():ult;
const semanas=Math.max(1,fimDia/7); const media=(doMes.length/semanas).toFixed(1).replace(".",",");
const first=(new Date(y,mo,1).getDay()+6)%7;
let cells=["S","T","Q","Q","S","S","D"].map(d=>`<div class="wd">${d}</div>`).join("");
const total=Math.ceil((first+ult)/7)*7;
for(let i=0;i<total;i++){
const d=new Date(y,mo,1-first+i), k=ymd(d), ss=m[k]||[], out=d.getMonth()!==mo;
const lbl=ss.length?esc(ss[0].planoNome)+(ss.length>1?` +${ss.length-1}`:""):"";
cells+=`<button class="cell ${out?"out":""}" data-dia="${k}"><div class="dot ${ss.length&&!out?"on":""} ${k===hoje?"today":""}">${d.getDate()}</div>${out?"":`<div class="wl">${lbl}</div>`}</button>`;
}
return `<div class="bar"><h1>Calendário</h1></div>
${statusNote()}
<div class="wrap">
<div class="stats"><div class="tot"><div class="muted" style="font-weight:600">Treinos no mês</div><div class="big">${doMes.length}</div></div>
<div class="tri"><div><div class="big">${best}</div><small>Melhor sequência</small></div>
<div><div class="big">${new Set(doMes.map(s=>s.data)).size}</div><small>Dias com treino</small></div>
<div><div class="big">${media}</div><small>Média semanal</small></div></div></div>
<div class="card">
<div class="mhead"><button class="circ" id="prevM" aria-label="Mês anterior">‹</button><h2>${MESES[mo]} ${y}</h2><button class="circ" id="nextM" aria-label="Mês seguinte">›</button></div>
<div class="grid">${cells}</div>
</div>
</div>`;
}

/* ---------- treino ---------- */
function rascunhoKey(pid){return "rasc-"+pid}
function abrirPlano(pid){
const p=plano(pid); if(!p) return;
st.planoAtivo=pid;
let d=null; try{d=JSON.parse(localStorage.getItem(rascunhoKey(pid))||"null")}catch(e){}
if(!d){
const ult=ultimaSessaoPlano(pid);
d={data:ymd(new Date()), ex:{}};
for(const e of p.exercicios){
const prev=ult?.exercicios?.find(x=>x.id===e.id);
d.ex[e.id]=prev?.series?.length?prev.series.map(s=>({reps:s.reps??"",kg:s.kg??""})):Array.from({length:e.series},()=>({reps:"",kg:""}));
}
}
st.draft=d; st.view="treino"; render(); scrollTo(0,0);
}
function guardarRascunho(){try{localStorage.setItem(rascunhoKey(st.planoAtivo),JSON.stringify(st.draft))}catch(e){}}

function viewTreino(){
const p=plano(st.planoAtivo), d=st.draft, ro=false;
const exs=p.exercicios.map((e,i)=>{
const ser=d.ex[e.id]||[]; const h=historicoEx(e.id)[0];
const pics=(e.fig||[]).slice(0,2).map((f,k,arr)=>`<div class="pic">${f}${arr.length>1?`<small>${k?"Fim":"Início"}</small>`:""}</div>`).join("");
const ss=i%2===0?`<div class="ss">Super série ${i/2+1} <span>· 2 exercícios seguidos, sem descanso</span></div>`:"";
return `${ss}<div class="card ex" data-ex="${e.id}">
<div class="row"><h3 class="sp">${esc(e.nome)}</h3><button class="histbtn" data-hist="${e.id}" aria-label="Histórico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button></div>
<div class="exhead"><div class="pics">${pics}</div>
<div class="presc"><b>Séries:</b> <span>${e.series}</span> &nbsp; <b>Repetições:</b> <span>${esc(e.reps)}</span></div></div>
<div class="sets"><div class="h"><div>#</div><div>Repetições</div><div>Kg</div><div></div></div>
${ser.map((s,i)=>`<div class="r"><b>${i+1}</b>
<input inputmode="numeric" type="number" min="0" data-f="reps" data-i="${i}" value="${esc(s.reps)}" ${ro?"disabled":""}>
<input inputmode="decimal" type="number" min="0" step="0.5" data-f="kg" data-i="${i}" value="${esc(s.kg)}" ${ro?"disabled":""}>
${ro?"<div></div>":`<button class="x" data-rm="${i}" aria-label="Apagar série">✕</button>`}</div>`).join("")}
${ro?"":`<button class="addset" data-add>+ Adicionar série</button>`}
</div>
${h?`<div class="last">Última vez (${fmtData(h.data)}): ${esc(fmtSeries(h.series))}</div>`:""}
</div>`}).join("");
return `<div class="bar"><button class="back" id="voltar" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><h1>${esc(p.nome)}</h1></div>
${statusNote()}
<label class="datef">📅 Data do treino <input type="date" id="dataT" value="${d.data}" max="${ymd(new Date())}" ${ro?"disabled":""}></label>
<div class="wrap">${exs}
${ro?"":`<button class="btn ghost" id="limpar" style="margin-top:6px">Limpar valores</button>`}</div>
${ro?"":`<button class="btn green finish" id="terminar" ${st.saving?"disabled":""}>${st.saving?"A guardar…":"Terminar treino"}</button>`}`;
}
function bindTreino(){
$("#voltar").onclick=()=>{st.view="inicio";render();scrollTo(0,0)};
const dt=$("#dataT"); if(dt) dt.onchange=()=>{st.draft.data=dt.value||ymd(new Date());guardarRascunho()};
document.querySelectorAll(".ex").forEach(card=>{
const id=card.dataset.ex; const ser=st.draft.ex[id];
card.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{ser[+inp.dataset.i][inp.dataset.f]=inp.value;guardarRascunho()});
card.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ser.splice(+b.dataset.rm,1);guardarRascunho();keepScroll()});
const add=card.querySelector("[data-add]"); if(add) add.onclick=()=>{const l=ser[ser.length-1];ser.push({reps:l?.reps??"",kg:l?.kg??""});guardarRascunho();keepScroll()};
});
document.querySelectorAll("[data-hist]").forEach(b=>b.onclick=()=>abrirHist(b.dataset.hist));
const lp=$("#limpar"); if(lp) lp.onclick=()=>{for(const k in st.draft.ex) st.draft.ex[k]=st.draft.ex[k].map(()=>({reps:"",kg:""}));guardarRascunho();keepScroll()};
const t=$("#terminar"); if(t) t.onclick=terminar;
}
function keepScroll(){const y=scrollY;render();scrollTo(0,y)}

async function terminar(){
if(st.saving) return;
const p=plano(st.planoAtivo);
const exercicios=p.exercicios.map(e=>({id:e.id,nome:e.nome,series:(st.draft.ex[e.id]||[])
.filter(s=>String(s.reps).trim()!=="").map(s=>({reps:Number(s.reps),kg:s.kg===""?0:Number(s.kg)}))}))
.filter(e=>e.series.length);
if(!exercicios.length){toast("Preenche pelo menos uma série.");return}
if(!API_URL){toast("A página ainda não está ligada à folha.");return}
st.saving=true; keepScroll();
const doc={id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2)),data:st.draft.data||ymd(new Date()),plano:p.id,planoNome:p.nome,exercicios,criadoEm:new Date().toISOString()};
try{
const j=await api({acao:"adicionar",sessao:doc});
try{localStorage.removeItem(rascunhoKey(p.id))}catch(e){}
st.saving=false; st.view="inicio"; receber(j.sessoes); scrollTo(0,0); toast("Treino guardado ✔");
}catch(err){
st.saving=false;
toast("Não foi possível guardar. Os valores ficam aqui; tenta outra vez.");
keepScroll();
}
}

/* ---------- folhas (modais) ---------- */
function sheet(html,bind){
const L=$("#layer"); L.innerHTML=`<div class="ov"><div class="sheet">${html}<button class="btn ghost" id="fechar" style="margin-top:14px">Fechar</button></div></div>`;
$(".ov",L).onclick=e=>{if(e.target.classList.contains("ov"))L.innerHTML=""};
$("#fechar").onclick=()=>L.innerHTML="";
bind&&bind(L);
}
function abrirDia(k){
const ss=(porDia()[k]||[]);
const body=ss.length?ss.map(s=>`<div class="sess"><h4>${esc(s.planoNome)}</h4><ul>${(s.exercicios||[]).map(e=>`<li><b>${esc(e.nome)}</b>: ${esc(fmtSeries(e.series||[]))}</li>`).join("")}</ul>
${API_URL?`<button class="del" data-del="${esc(s._id)}">Apagar este registo</button>`:""}</div>`).join("")
:`<div class="empty">Sem treinos neste dia.</div>`;
sheet(`<h2>${fmtData(k)}</h2><div class="muted small" style="margin-bottom:6px">${ss.length} ${ss.length===1?"treino":"treinos"}</div>${body}`,L=>{
L.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
if(b.dataset.ok){ api({acao:"apagar",id:b.dataset.del}).then(j=>{L.innerHTML="";receber(j.sessoes);toast("Registo apagado")}).catch(()=>toast("Não foi possível apagar.")) }
else { b.dataset.ok=1; b.textContent="Tocar outra vez para confirmar" }
});
});
}
function abrirHist(exId){
const e=PLANOS.flatMap(p=>p.exercicios).find(x=>x.id===exId);
const h=historicoEx(exId).slice(0,15);
sheet(`<h2>${esc(e?.nome)}</h2><div class="muted small" style="margin-bottom:6px">Histórico</div>`+
(h.length?h.map(x=>`<div class="sess"><h4>${fmtData(x.data)}</h4><ul><li>${esc(fmtSeries(x.series))}</li></ul></div>`).join(""):`<div class="empty">Ainda sem registos.</div>`));
}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}

/* ---------- arranque ---------- */
try{const c=JSON.parse(localStorage.getItem("cache-sessoes")||"null");if(c){st.sessoes=c.map(s=>({...s,_id:s.id}))}}catch(e){}
render();
async function carregar(){
if(!API_URL) return;
try{const j=await api();receber(j.sessoes)}
catch(e){st.dbOk=false;st.loaded=true;if(st.view!=="treino")render()}
}
if(API_URL){
const timer=setTimeout(()=>{if(!st.loaded){st.slow=true;if(st.view!=="treino")render()}},10000);
carregar().finally(()=>clearTimeout(timer));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)carregar()});
setInterval(()=>{if(!document.hidden&&st.view!=="treino")carregar()},120000);
}
</script>
</body>
</html>
